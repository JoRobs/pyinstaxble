[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "pyinstaxble"
version = "0.2.2"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
  "anyio>=4.14.2",
  "bleak>=3.0.2",
  "pillow==9.5.0",
  "simplepyble==0.7.1",
]

[project.optional-dependencies]
dev=[
  "pycodestyle==2.14.0",
]
lint = [
    "ruff>=0.16.0",
]

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
ignore = [
  "BLE001",
]
