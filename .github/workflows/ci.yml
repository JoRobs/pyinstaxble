name: Continuous Integration
run-name: CI ${{ github.event_name }} ${{ github.ref }}

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          cache-python: "true"
          python-version: 3.14
          version: "0.11.32"

      - name: Build
        id: build
        run: |
          uv build

      - name: Ruff format
        id: format
        run: |
          uv tool run -q ruff format --diff 2>format.stderr.txt 1> format.stdout.txt

      - name: Ruff lint
        id: lint
        run: |
          uv tool run -q ruff check --statistics 2>stats.stderr.txt 1>stats.stdout.txt \
            || uv tool run -q ruff check 2>check.stderr.txt 1>check.stdout.txt

      - name: Summary
        if: success() || failure()
        run: |
          if [[ ${{ steps.build.outcome }} ~= (success|failure) ]]; then
            cat >> $GITHUB_STEP_SUMMARY <<EOF
          # Build Result

          ${{ steps.build.outcome }}

          EOF
          fi

          if [[ ${{ steps.format.outcome }} ~= (success|failure) ]]; then
            cat >> $GITHUB_STEP_SUMMARY <<EOF
          # Ruff Format Output

          \`\`\`
          Summary

          $(cat format.stderr.txt)
          \`\`\`

          <details>
          <summary>Details</summary>

          \`\`\`
          $(cat format.stdout.txt)
          \`\`\`

          </details>

          EOF
          fi

          if [[ ${{ steps.lint.outcome }} ~= (success|failure) ]]; then
            cat >> $GITHUB_STEP_SUMMARY <<EOF
          # Ruff Lint Output

          \`\`\`
          Summary

          $(cat stats.stdout.txt)
          \`\`\`

          <details>
          <summary>Details</summary>

          \`\`\`
          $(cat check.stdout.txt)
          \`\`\`
          </details>

          EOF
          fi

